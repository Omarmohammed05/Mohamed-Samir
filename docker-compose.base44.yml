services:
  app:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - NODE_ENV=development
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-}
      - WATCHPACK_POLLING=true
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/en').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  app_node_modules:
